<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Coming soon</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
      h1 { font-weight: 500; font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0; opacity: 0.7; }
      input, button { font: inherit; padding: 0.4rem 0.6rem; margin-top: 1.25rem; }
      /* The loader sets data-keyhole: loading | locked | password | wrong-password | unsupported. */
      html[data-keyhole='loading'] main { visibility: hidden; }
      #keyhole-password, .wrong, .unsupported { display: none; }
      html[data-keyhole$='password'] #keyhole-password { display: block; }
      html[data-keyhole$='password'] .locked { display: none; }
      html[data-keyhole='wrong-password'] .wrong { display: block; margin-top: 0.75rem; }
      html[data-keyhole='unsupported'] .unsupported { display: block; margin-top: 1.25rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Coming soon</h1>
      <p class="locked">Something new is on its way. Check back later.</p>
      <form id="keyhole-password">
        <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required />
        <button type="submit">Open</button>
        <p class="wrong" role="alert">Wrong password</p>
      </form>
      <p class="unsupported">This page needs a secure (HTTPS) connection and an up-to-date browser.</p>
    </main>
  </body>
</html>
