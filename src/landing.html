<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Coming soon</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
      h1 { font-weight: 500; font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0; opacity: 0.7; }
      button { margin-top: 1.25rem; font: inherit; padding: 0.4rem 1rem; cursor: pointer; }
      /* While a key is being tried, show nothing instead of flashing the landing text. */
      html[data-keyhole='loading'] main { visibility: hidden; }
    </style>
  </head>
  <body>
    <main>
      <h1>Coming soon</h1>
      <p>Something new is on its way. Check back later.</p>
      <button id="keyhole-retry" type="button" hidden>Try again</button>
      <p id="keyhole-unsupported" hidden>This page needs a secure (HTTPS) connection and an up-to-date browser.</p>
    </main>
  </body>
</html>
